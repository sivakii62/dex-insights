spring:
  application:
    name: dex-insights
  threads:
    virtual:
      enabled: true            # Java 21 virtual threads: IO-bound request handling without a large platform pool
  jackson:
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true            # RFC 9457 responses for framework-raised errors

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

dex:
  data:
    stores: classpath:data/stores.json
    transactions: classpath:data/transactions.json
    incidents: classpath:data/incidents.json
  cors:
    allowed-origins: ${DEX_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  insights:
    low-tank-threshold: 0.25      # tanks at or below 25% of capacity are flagged as runout risk
    top-n: 5
  chat:
    top-k: 6
    max-context-chars: 4000
    llm:
      # Optional. Left disabled so the application runs with no credentials.
      # Works against any OpenAI-compatible endpoint (OpenAI, Ollama, vLLM).
      enabled: ${DEX_CHAT_LLM_ENABLED:false}
      base-url: ${DEX_CHAT_LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${DEX_CHAT_LLM_API_KEY:}
      model: ${DEX_CHAT_LLM_MODEL:gpt-4o-mini}
      timeout: 20s

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [%X{requestId:-}] %-40.40logger{39} : %m%n"
  level:
    com.dex.insights: INFO
