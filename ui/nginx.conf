# Serves the built Angular SPA and reverse-proxies API calls to the backend
# service, so the browser only ever talks to one origin — in dev that's the
# Angular CLI proxy (proxy.conf.json); here it's this block. Same relative
# paths in both places, so there is nothing environment-specific to keep in sync.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed filenames (main-XXXX.js, chunk-XXXX.js) are safe to cache forever.
    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /v1/ {
        proxy_pass http://backend:8080/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-API route resolves client-side.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
